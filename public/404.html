<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | 가야공인중개사사무소</title>
  <style>
    body { margin: 0; min-height: 100vh; word-break: keep-all; display: grid; place-items: center; background: #f7f1e6; color: #1a1208; font: 18px/1.7 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 520px; text-align: center; background: #fffdf8; border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 24px rgb(26 18 8 / .08); }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 18px; color: #3f3224; font-size: 18px; }
    a { display: inline-block; margin: 6px; padding: 14px 18px; min-height: 52px; border-radius: 12px; font-weight: 800; font-size: 18px; text-decoration: none; }
    .p { background: #0b2545; color: #fff; }
    .s { background: #f0b429; color: #1a1208; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; color: #0b2545; margin: 0 0 14px; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <p class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20h-6v-5H9v5H3z" fill="#c9a46a"/></svg> 가야공인중개사사무소</p>
    <h1>찾으시는 페이지가 없습니다</h1>
    <p>거래가 완료되어 내려간 매물이거나 주소가 바뀌었을 수 있습니다.<br>비슷한 매물을 찾아 드릴게요.</p>
    <a class="p" href="/" data-home>전체 매물 보기</a>
    <a class="s" href="tel:01034060071">전화 010-3406-0071</a>
  </main>
  <script>
    (function () {
      var a = document.querySelector("[data-home]");
      if (a.getAttribute("href") !== "/") return;
      var path = location.pathname, i = path.indexOf("/listing/");
      var home = i >= 0 ? path.slice(0, i + 1) : (location.hostname.slice(-10) === ".github.io" ? "/" + (path.split("/")[1] || "") + "/" : "/");
      a.setAttribute("href", home.replace(/\/+/g, "/"));
    })();
  </script>
</body>
</html>
