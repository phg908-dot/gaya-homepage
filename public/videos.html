  <script src="assets/js/common.js"></script>
  <script>
  (async function () {
    const G = window.GAYA, el = G.el, $ = (id) => document.getElementById(id);
    const { site, videos } = await G.loadData();
    G.fillOfficeBits(site);
    G.renderFooter(site);
    let kind = "", q = "", announceNext = false, t = null;
    function render() {
      const words = q.toLowerCase().split(/\s+/).filter(Boolean);
      const rows = videos.filter((v) =>
        (kind === "" || (kind === "short" && v.isShort) || (kind === "video" && !v.isShort) || (kind === "linked" && v.listingNos.size)) &&
        words.every((w) => ((v.title || "") + " " + (v.description || "")).toLowerCase().includes(w)));
      $("count").textContent = rows.length + "개";
      $("empty").hidden = rows.length > 0;
      $("empty").textContent = videos.length ? "조건에 맞는 영상이 없습니다." : "새 매물 영상을 준비하고 있습니다.";
      if (announceNext) { G.announce(rows.length ? `영상 ${rows.length}개` : "조건에 맞는 영상이 없습니다"); announceNext = false; }
      $("videoGrid").replaceChildren(...rows.map((v) => el("article", { class: "vcard" },
        G.videoFacade(v.id, v.title, { short: v.isShort }),
        el("div", { class: "vbody" },
          el("h2", { text: v.title }),
          el("p", { class: "muted small", text: G.fmtDate(v.published) + (v.isShort ? " · 쇼츠" : "") }),
          ...[...v.listingNos].map((no) => el("a", { class: "vlink", href: G.listingUrl(no), text: `매물 No.${no} 보기 →` })),
          el("div", { class: "vactions" }, ...G.videoAsk(v, site))))));
    }
    document.querySelectorAll(".vtools .chip").forEach((c) => c.addEventListener("click", () => {
      kind = c.dataset.kind;
      document.querySelectorAll(".vtools .chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
      announceNext = true;
      render();
    }));
    $("vq").addEventListener("input", (e) => {
      q = e.target.value.trim();
      clearTimeout(t);
      t = setTimeout(() => { announceNext = true; render(); }, 400);
    });
    render();
  })();
  </script>
