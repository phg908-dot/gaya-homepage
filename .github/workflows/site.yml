# 홈페이지 자동화
#  1) 매시간 유튜브 채널의 새 영상을 확인해 public/data/videos.json 에 추가하고 커밋
#  2) 매물/설정 파일을 고쳐 main에 올리면 명시사항 점검 결과를 Actions 화면에 표시
#  3) 배포본을 gh-pages 브랜치에 올림 (GitHub Pages: Settings → Pages → Deploy from a branch → gh-pages)
#     Cloudflare Pages를 쓰는 경우 저장소 변수 HOSTING=cloudflare 로 3)을 끔
name: 홈페이지 자동화

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.videos.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: 유튜브 새 영상 수집
        id: videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python3 scripts/update_videos.py || echo "::warning::영상 수집 실패 — 기존 목록을 유지합니다"
          if git diff --quiet -- public/data/videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 영상 목록 커밋
        if: steps.videos.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/videos.json
          git commit -m "유튜브 영상 목록 자동 갱신"
          git pull --rebase
          git push

      - name: 광고 명시사항 점검
        run: python3 scripts/build.py --check --gha

      - name: 스크립트 테스트
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -p "test_*.py"

      # 공개 저장소는 60일간 활동이 없으면 예약 실행이 꺼지므로, 실행될 때마다 스스로를 다시 켜 둔다
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable site.yml --repo "${{ github.repository }}"

  # 배포: 배포본(dist/)을 gh-pages 브랜치에 올린다 → GitHub Pages가 이 브랜치를 그대로 공개
  #   (Cloudflare Pages 등 다른 곳에서 배포한다면 저장소 변수 HOSTING=cloudflare 로 이 단계를 끔)
  deploy:
    needs: sync
    if: vars.HOSTING != 'cloudflare' && (github.event_name != 'schedule' || needs.sync.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 배포본 생성 (샘플·계약완료·명시사항 누락 매물 제외, 사진 위치정보 제거)
        run: python3 scripts/build.py --prod --gha

      - name: gh-pages 브랜치로 공개
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "홈페이지 배포 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
